version: 2
models:
  - name: stg_vehicles
    description: Typed, deduplicated vehicle position events (one row per vehicle per event_ts)
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [vehicle_id, event_ts]
    columns:
      - name: vehicle_id
        tests: [not_null]
      - name: event_ts
        tests: [not_null]
      - name: latitude
        tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 41.5, max_value: 43.0 }   # Massachusetts
      - name: longitude
        tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: -72.0, max_value: -70.0 }
  - name: fct_vehicle_positions
    description: Incremental fact table, 2-hour lookback for late-arriving events
    columns:
      - name: vehicle_id
        tests: [not_null]
      - name: mode
        tests:
          - accepted_values:
              arguments:
                values: [light_rail, subway, commuter_rail, bus, ferry, other]
      - name: route_id
        tests:
          - relationships:
              arguments: { to: ref('stg_routes'), field: route_id }
              config: { severity: warn }
  - name: agg_route_hourly
    description: Route x hour rollup — throughput, speed, ingest lag
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [route_id, event_hour]
