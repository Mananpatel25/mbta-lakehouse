mbta_lakehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '/opt/airflow/dbt/lakehouse.duckdb') }}"
      extensions: [httpfs, parquet]
      settings:
        s3_endpoint: "{{ env_var('S3_ENDPOINT_HOST', 'minio:9000') }}"
        s3_access_key_id: "{{ env_var('AWS_ACCESS_KEY_ID', 'minio') }}"
        s3_secret_access_key: "{{ env_var('AWS_SECRET_ACCESS_KEY', 'minio12345') }}"
        s3_use_ssl: false
        s3_url_style: path
      threads: 4
    ci:
      type: duckdb
      path: ":memory:"
      threads: 2
